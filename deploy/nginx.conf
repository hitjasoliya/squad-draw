# nginx front door for squad-draw.
# - Port 80 fronts the Next.js web app (container "web", :3000)
# - /socket.io/ is reverse-proxied to the Socket.IO server (container
#   "ws-server", :8080) with WebSocket upgrade support, so browsers talk to a
#   single origin and ports 3000/8080 stay closed to the world.
server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://ws-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Keep WebSocket connections alive indefinitely
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
